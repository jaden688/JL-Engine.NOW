<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JL Engine</title>
    <style>
      :root { color-scheme: dark; --bg:#0d1017; --panel:#161b26; --line:#242c3a; --fg:#e6ecf5; --muted:#8b97ab; --accent:#5ee0c0; }
      * { box-sizing:border-box; }
      body { margin:0; font:13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
      header { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
      header b { letter-spacing:.5px; font-size:13px; }
      #state { color:var(--accent); font-size:11px; }
      #operator { background:#0f131c; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:11px ui-monospace, monospace; }
      #toolbar { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
      #toolbar button { padding:4px 10px; font:11px ui-monospace, monospace; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; }
      #toolbar button:hover { border-color:var(--accent); }
      #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
      .bubble { max-width:92%; padding:8px 10px; border-radius:9px; white-space:pre-wrap; word-break:break-word; font-size:12.5px; }
      .bubble.user { align-self:flex-end; background:#20304a; }
      .bubble.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
      .bubble.tool { align-self:flex-start; background:#122019; border:1px solid #1e3a2c; color:#9be0b8; font-size:11.5px; }
      .bubble.error { align-self:flex-start; background:#3a1d1d; color:#ffb3b3; }
      #activity { border-top:1px solid var(--line); max-height:150px; overflow:auto; padding:6px 12px; }
      #activity h3 { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:2px 0 6px; }
      .act { display:flex; gap:8px; align-items:flex-start; padding:3px 0; font-size:11.5px; }
      .act .dot { flex:none; width:8px; height:8px; border-radius:50%; margin-top:5px; }
      .act.ok .dot { background:var(--accent); box-shadow:0 0 6px rgba(94,224,192,.7); }
      .act.miss .dot { background:#ff6b6b; }
      .act .verb { color:var(--accent); font-weight:600; min-width:56px; }
      .act.miss .verb { color:#ff9b9b; }
      .act .txt { color:var(--fg); word-break:break-word; }
      #activity .empty { color:var(--muted); font-size:11px; }
      #hud { border-top:1px solid var(--line); padding:8px 12px; font-size:10.5px; color:var(--muted); white-space:pre-wrap; max-height:110px; overflow:auto; }
      #form { display:flex; gap:6px; padding:10px 12px; border-top:1px solid var(--line); }
      #msg { flex:1; padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:#0f131c; color:var(--fg); font:inherit; }
      #form button { padding:8px 12px; border-radius:7px; border:0; background:var(--accent); color:#04120e; font-weight:600; cursor:pointer; }
    </style>
  </head>
  <body>
    <header>
      <b>JL ENGINE</b>
      <span style="display:flex; gap:8px; align-items:center;">
        <select id="operator" title="active operator"></select>
        <span id="state">booting…</span>
      </span>
    </header>
    <div id="toolbar">
      <button data-cmd="/read">read page</button>
      <button data-cmd="/tabs">tabs</button>
      <button data-cmd="/help">help</button>
    </div>
    <div id="log"></div>
    <section id="activity"><h3>browser activity</h3><div id="acts"><span class="empty">nothing yet — the operator's actions show here as it works</span></div></section>
    <pre id="hud">idle</pre>
    <form id="form" autocomplete="off">
      <input id="msg" placeholder="talk, or /go /read /click /fill /tabs" />
      <button type="submit">▸</button>
    </form>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
