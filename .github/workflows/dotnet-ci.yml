name: .NET 11 CI and Windows release

on:
  push:
    branches: [master, "productize/**"]
  pull_request:
    branches: [master, "productize/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Restore, compile, and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install .NET 11 RC3 SDK
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "dotnet"
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer
          & $installer -Version 11.0.100-rc.3 -Architecture x64 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          & (Join-Path $installDir "dotnet.exe") --info
      - name: Restore solution
        run: dotnet restore "JL_Engine now/dotnet/JLEngine.sln"
      - name: Run Release tests
        run: dotnet test "JL_Engine now/dotnet/JLEngine.sln" -c Release --no-restore

  package:
    name: Publish and build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install .NET 11 RC3 SDK
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "dotnet"
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $installer
          & $installer -Version 11.0.100-rc.3 -Architecture x64 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $installDir
          & (Join-Path $installDir "dotnet.exe") --info
      - name: Publish self-contained Windows build
        run: dotnet publish "JL_Engine now/dotnet/JLEngine.Host/JLEngine.Host.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/JLEngine-win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "JL_Engine now/packaging/windows/JL-Engine.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: JL-Engine-Windows-Installer
          path: artifacts/JL-Engine-Setup.exe
          if-no-files-found: error
      - name: Upload portable publish folder
        uses: actions/upload-artifact@v6
        with:
          name: JLEngine-win-x64
          path: artifacts/JLEngine-win-x64/
          if-no-files-found: error
