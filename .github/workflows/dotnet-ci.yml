name: .NET 10 CI and Windows release

on:
  push:
    branches: [master, "productize/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: SDK and dependency restore
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Capture SDK and restore diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet --info | Tee-Object -FilePath artifacts/sdk-info.txt
          dotnet restore "JL_Engine now/dotnet/JLEngine.sln" --verbosity normal *> artifacts/restore.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content artifacts/restore.log -Tail 100
            exit $LASTEXITCODE
          }
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-diagnostics
          path: artifacts/
          if-no-files-found: warn

  test:
    name: Compile and test solution
    needs: restore
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore test dependencies
        run: dotnet restore "JL_Engine now/dotnet/JLEngine.sln"
      - name: Run Release tests
        run: dotnet test "JL_Engine now/dotnet/JLEngine.sln" -c Release --no-restore

  package:
    name: Publish and build installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows build
        run: dotnet publish "JL_Engine now/dotnet/JLEngine.Host/JLEngine.Host.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/JLEngine-win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "JL_Engine now/packaging/windows/JL-Engine.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JL-Engine-Windows-Installer
          path: artifacts/JL-Engine-Setup.exe
          if-no-files-found: error
      - name: Upload portable publish folder
        uses: actions/upload-artifact@v4
        with:
          name: JLEngine-win-x64
          path: artifacts/JLEngine-win-x64/
          if-no-files-found: error
