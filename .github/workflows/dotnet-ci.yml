name: .NET 10 CI and Windows release

on:
  push:
    branches: [master, "productize/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-check:
    name: Install and verify .NET 10 SDK
    runs-on: windows-latest
    steps:
      - name: Install .NET 10 SDK
        shell: pwsh
        run: choco install dotnet-sdk --version=10.0.100 --yes --no-progress
      - name: Verify SDK
        shell: pwsh
        run: |
          refreshenv
          dotnet --info

  restore:
    name: Restore solution
    needs: sdk-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        shell: pwsh
        run: choco install dotnet-sdk --version=10.0.100 --yes --no-progress
      - name: Restore
        run: dotnet restore "JL_Engine now/dotnet/JLEngine.sln"

  test:
    name: Compile and test
    needs: restore
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        shell: pwsh
        run: choco install dotnet-sdk --version=10.0.100 --yes --no-progress
      - name: Run Release tests
        run: dotnet test "JL_Engine now/dotnet/JLEngine.sln" -c Release

  package:
    name: Publish and build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        shell: pwsh
        run: choco install dotnet-sdk --version=10.0.100 --yes --no-progress
      - name: Publish self-contained Windows build
        run: dotnet publish "JL_Engine now/dotnet/JLEngine.Host/JLEngine.Host.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/JLEngine-win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "JL_Engine now/packaging/windows/JL-Engine.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JL-Engine-Windows-Installer
          path: artifacts/JL-Engine-Setup.exe
          if-no-files-found: error
      - name: Upload portable publish folder
        uses: actions/upload-artifact@v4
        with:
          name: JLEngine-win-x64
          path: artifacts/JLEngine-win-x64/
          if-no-files-found: error
